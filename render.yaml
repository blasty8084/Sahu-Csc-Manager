# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — SAHU CSC Backend API
#  Docs: https://render.com/docs/blueprint-spec
#
#  Deploy: render.com → New → Blueprint → connect your GitHub repo
#  Region: Singapore (ap-southeast-1) — closest to Odisha, India
#
#  Free tier notes:
#  • Service spins down after 15 min of inactivity (cold start ~30 s)
#  • No SSH shell — admin/operator accounts are created automatically on
#    first boot via startup-init.ts (reads ADMIN_PASSWORD / OPERATOR_PASSWORD)
#  • No persistent disk — avatars are stored as base64 in Neon DB
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: sahu-csc-api
    runtime: node
    region: singapore
    plan: free

    # Build & start run from the workspace ROOT so pnpm workspace resolution works.
    rootDir: .

    buildCommand: bash render-build.sh

    startCommand: node --dns-result-order=ipv4first --enable-source-maps artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/health

    # Render will use the version from .nvmrc automatically.
    # Minimum Node 20 required (see .nvmrc).

    envVars:
      # ── Server ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: LOG_LEVEL
        value: info

      - key: ALLOW_NON_INDIA
        value: "true"           # Render servers are outside India

      # ── Database (Neon) ───────────────────────────────────────────────────
      # neon.tech → your project → Connection Details → Connection string
      - key: NEON_DATABASE_URL
        sync: false             # postgresql://user:pass@host.neon.tech/db?sslmode=require

      - key: DB_POOL_MAX
        value: "5"              # Neon free tier max connections

      # ── Session ───────────────────────────────────────────────────────────
      - key: SESSION_SECRET
        generateValue: true     # Render auto-generates a secure random value

      # ── Admin accounts ────────────────────────────────────────────────────
      # These are used by startup-init.ts to create accounts on first boot.
      - key: ADMIN_PASSWORD
        sync: false

      - key: OPERATOR_PASSWORD
        sync: false

      - key: ADMIN_EMAIL
        sync: false             # optional — defaults to SMTP_USER

      - key: ADMIN_MOBILE
        sync: false             # optional — defaults to 0000000000

      - key: OPERATOR_EMAIL
        sync: false             # optional — defaults to operator@example.com

      - key: OPERATOR_MOBILE
        sync: false             # optional — defaults to 0000000001

      # ── CORS ─────────────────────────────────────────────────────────────
      # Set to your Vercel (or custom) frontend URL after deploying the frontend.
      - key: CORS_ORIGIN
        sync: false             # https://sahu-csc-manager-sahu-csc.vercel.app

      # ── Business info ─────────────────────────────────────────────────────
      - key: BUSINESS_NAME
        value: SAHU CSC Center

      - key: BUSINESS_ADDRESS
        value: "Main Road, Bargarh, Odisha"

      # ── Email (Resend HTTP API) ───────────────────────────────────────────
      # resend.com → API Keys → Create API Key → copy and paste here
      - key: RESEND_API_KEY
        sync: false             # re_xxxxxxxxxxxxxxxxxxxx

      # From address — verified domain sahucsc.dpdns.org
      - key: RESEND_FROM
        value: "SAHU CSC <info@sahucsc.dpdns.org>"

      # Kept as fallback recipient for test emails
      # - key: SMTP_USER
      #   sync: false           # kept as fallback test-email recipient

      - key: VAPID_EMAIL
        sync: false             # e.g.  mailto:you@gmail.com

      # ── Backblaze B2 (file storage) ───────────────────────────────────────
      - key: B2_KEY_ID
        sync: false

      - key: B2_APP_KEY
        sync: false

      - key: B2_BUCKET_NAME
        value: SAHUCSCV2

      - key: B2_BUCKET_ENDPOINT
        value: s3.us-west-004.backblazeb2.com
        # Code auto-prepends https:// — plain host or full URL both work.

      # ── Upstash Redis (rate-limiting & cache) ─────────────────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false             # https://xxx.upstash.io

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Auto-backup external trigger (Render free tier workaround) ──────────
      # Render free tier sleeps after 15 min inactivity — node-cron never fires.
      # Fix: set this token and configure a free external cron (cron-job.org):
      #   URL:     POST https://<your-render-url>/api/internal/backup
      #   Header:  x-backup-token: <this value>
      #   Schedule: every hour — the endpoint checks if backup is due and skips if not.
      - key: BACKUP_TRIGGER_TOKEN
        sync: false             # any long random string, e.g. openssl rand -hex 32

      # ── Optional ──────────────────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

      - key: MAXMIND_LICENSE_KEY
        sync: false
